        <div class="admin-sidebar-bottom">
          <button id="adminLogoutBtn" class="admin-logout" type="button">

    <main class="admin-main">
      <div class="admin-page-head">
        <div>
          <h2>Settings</h2>
          <p>Manage your website settings</p>
        </div>
      </div>

      <div class="settings-wrap">

        <div class="settings-card">
          <h3>Website Information</h3>
          <form id="websiteSettingsForm" class="form-grid-1">
            <div class="form-field">
              <label for="settingCompanyName">Company Name</label>
              <input type="text" id="settingCompanyName" />
            </div>

            <div class="form-field">
              <label for="settingTagline">Tagline</label>
              <input type="text" id="settingTagline" />
            </div>

            <button type="submit" class="save-btn">Save Changes</button>
            <p id="websiteSettingsMessage" class="admin-message"></p>
          </form>
        </div>

        <div class="settings-card">
          <h3>Contact Information</h3>
          <form id="contactSettingsForm" class="form-grid-2">
            <div class="form-field">
              <label for="settingPhone">Phone</label>
              <input type="text" id="settingPhone" />
            </div>

            <div class="form-field">
              <label for="settingEmail">Email</label>
              <input type="text" id="settingEmail" />
            </div>

            <div class="form-field form-grid-1" style="grid-column:1 / -1;">
              <label for="settingAddress">Address</label>
              <input type="text" id="settingAddress" />
            </div>

            <div class="form-field form-grid-1" style="grid-column:1 / -1;">
              <label for="settingWhatsapp">WhatsApp Number</label>
              <input type="text" id="settingWhatsapp" />
            </div>

            <button type="submit" class="save-btn">Save Changes</button>
            <p id="contactSettingsMessage" class="admin-message"></p>
          </form>
        </div>

        <div class="settings-card">
          <h3>Social Media</h3>
          <form id="socialSettingsForm" class="form-grid-1">
            <div class="form-field">
              <label for="settingFacebook">Facebook</label>
              <input type="text" id="settingFacebook" placeholder="https://facebook.com/yourpage" />
            </div>

            <div class="form-field">
              <label for="settingInstagram">Instagram</label>
              <input type="text" id="settingInstagram" placeholder="https://instagram.com/yourpage" />
            </div>

            <div class="form-field">
              <label for="settingTiktok">TikTok</label>
              <input type="text" id="settingTiktok" placeholder="https://tiktok.com/@yourpage" />
            </div>

            <button type="submit" class="save-btn">Save Changes</button>
            <p id="socialSettingsMessage" class="admin-message"></p>
          </form>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
