<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


  <!-- HEADER -->
  <header class="site-header">

    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open menu">
      ☰
    </button>
  
    <div class="header-left">
      <a href="index.html" class="logo-box">
        <img src="images/logo.jpeg" alt="Luxury Cars Logo">
      </a>
    </div>
  
    <nav class="main-nav" id="mainNav">
      <a href="rentals.html">Rentals</a>
      <a href="cars-for-sale.html">Cars for Sale</a>
      <a href="accessories.html">Accessories</a>
    </nav>
  
    <div class="header-right" id="siteHeaderAuth">
  
      <a href="login.html" class="login-link guest-only">
        <span class="login-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="M13 6l6 6-6 6"></path>
          </svg>
        </span>
        <span>Log In</span>
      </a>
  
      <a href="signup.html" class="signup-btn guest-only">
        <span class="signup-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M1 21c0-4 3-7 8-7"></path>
            <line x1="19" y1="8" x2="19" y2="14"></line>
            <line x1="22" y1="11" x2="16" y2="11"></line>
          </svg>
        </span>
        <span>Sign Up</span>
      </a>
  
      <a href="account.html" class="login-link user-only" style="display:none;">
        <span>My Account</span>
      </a>
  
      <button type="button" class="signup-btn logout-btn user-only" style="display:none;">
        <span>Log Out</span>
      </button>
  
    </div>
  
  </header>


  <!-- RESET PASSWORD FORM -->
  <section class="auth-page">

    <div class="auth-card">

      <h1>Reset Password</h1>

      <p>
        Enter your email address and we will send you a reset link.
      </p>


      <form>

        <div class="form-group">

            <label>Email Address</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="M3 7l9 6 9-6"></path>
                </svg>
              </span>
              <input type="email" placeholder="your@email.com" />
            </div>

        </div>


        <button class="auth-btn">
          Send Reset Link
        </button>


      </form>


      <p class="auth-switch">

        Remember your password?

        <a href="login.html">
          Log In
        </a>

      </p>


    </div>

  </section>



</body>
</html>
