<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Bookings</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css" />
</head>
<body data-admin-page="bookings">
  <div class="admin-page-loader" id="adminPageLoader">
    <div class="admin-loader-inner">
      <div class="admin-loader-logo">Luxury Cars Admin</div>
      <div class="admin-loader-spinner"></div>
    </div>
  </div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <h1>Prestige Auto</h1>
        <p>Admin Dashboard</p>
      </div>

      <nav class="admin-nav">
        <a href="admin-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="admin-rentals.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 13l2-5h14l2 5"></path>
            <path d="M5 13h14v5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-5Z"></path>
            <circle cx="7.5" cy="17.5" r="1"></circle>
            <circle cx="16.5" cy="17.5" r="1"></circle>
          </svg>
          <span>Cars for Rent</span>
        </a>

        <a href="admin-sales.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="3" width="14" height="18" rx="2"></rect>
            <path d="M9 7h6"></path>
          </svg>
          <span>Cars for Sale</span>
        </a>

        <a href="admin-accessories.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
            <path d="M3 4h2l2.6 10.4a1 1 0 0 0 1 .76h9.7a1 1 0 0 0 .97-.76L21 7H7"></path>
          </svg>
          <span>Accessories</span>
        </a>

        <a href="admin-bookings.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
          </svg>
          <span>Bookings</span>
        </a>

        <a href="admin-orders.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
            <path d="M3 4h2l2.6 10.4a1 1 0 0 0 1 .76h9.7a1 1 0 0 0 .97-.76L21 7H7"></path>
          </svg>
          <span>Orders</span>
        </a>

        <a href="admin-customers.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Customers</span>
        </a>

        <a href="admin-analytics.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18"></path>
            <path d="M18 9l-5 5-3-3-4 4"></path>
          </svg>
          <span>Analytics</span>
        </a>

        <a href="admin-settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L4.21 7.2a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0A1.65 1.65 0 0 0 10 3.25V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="admin-sidebar-bottom">
        <button class="admin-logout" id="adminLogoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-page-head">
        <div>
          <h2>Rental Bookings</h2>
          <p>Manage customer reservations</p>
        </div>
      
        <button type="button" class="admin-primary-btn" id="openBookingModalBtn">
          + New Booking
        </button>
      </div>

      <div class="panel-card">
        <div class="admin-toolbar">
          <input type="text" id="adminBookingsSearch" class="admin-search" placeholder="Search customer, email, car..." />
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Car</th>
                <th>Dates</th>
                <th>Price</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="adminBookingsBody">
              <tr>
                <td colspan="7">Loading bookings...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div class="admin-modal" id="bookingModal">
    <div class="admin-modal-card">
      <div class="admin-modal-head">
        <h3>Create Booking</h3>
        <button type="button" class="admin-modal-close" id="closeBookingModalBtn">×</button>
      </div>
  
      <form id="bookingForm" class="admin-form-grid">
        <div class="admin-form-group admin-form-group-full">
          <label for="bookingCar">Car</label>
          <select id="bookingCar" required>
            <option value="">Select car</option>
          </select>
        </div>
  
        <div class="admin-form-group">
          <label for="bookingName">Customer Name</label>
          <input type="text" id="bookingName" required />
        </div>
  
        <div class="admin-form-group">
          <label for="bookingEmail">Customer Email</label>
          <input type="email" id="bookingEmail" />
        </div>
  
        <div class="admin-form-group">
          <label for="bookingPhone">Customer Phone</label>
          <input type="text" id="bookingPhone" />
        </div>
  
        <div class="admin-form-group">
          <label for="bookingStart">Start Date</label>
          <input type="date" id="bookingStart" required />
        </div>
  
        <div class="admin-form-group">
          <label for="bookingEnd">End Date</label>
          <input type="date" id="bookingEnd" required />
        </div>
  
        <div class="admin-form-group">
          <label for="bookingChauffeur">Chauffeur</label>
          <select id="bookingChauffeur">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
  
        <div class="admin-form-group admin-form-group-full">
          <div id="bookingPreview" class="admin-form-message"></div>
        </div>
  
        <div class="admin-form-actions">
          <button type="button" class="admin-secondary-btn" id="cancelBookingModalBtn">Cancel</button>
          <button type="submit" class="admin-primary-btn">Save Booking</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
